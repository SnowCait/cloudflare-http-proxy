name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run cf-typecheck
      - name: Report Worker bundle size
        env:
          WRANGLER_OUTPUT_FILE_PATH: .wrangler/wrangler-output.ndjson
        run: |
          rm -f "$WRANGLER_OUTPUT_FILE_PATH"
          npm run cf-bundle
          jq -s -r '
            [.[] | select(.type == "deploy" and .bundle_size)] |
            if length == 1 then
              .[0].bundle_size |
              "### Worker bundle size\n\n`Total Upload: \(.raw_bytes / 1024 * 100 | round / 100) KiB / gzip: \(.gzip_bytes / 1024 * 100 | round / 100) KiB`"
            else
              error("Expected exactly one deploy entry with bundle_size")
            end
          ' "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_STEP_SUMMARY"
      - run: npm test
