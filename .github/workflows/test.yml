name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run cf-typecheck
      - name: Report Worker bundle size
        run: |
          bundle_output="$(npm run cf-bundle 2>&1)" || {
            printf '%s\n' "$bundle_output"
            exit 1
          }
          printf '%s\n' "$bundle_output"

          total_upload_lines="$(printf '%s\n' "$bundle_output" | grep 'Total Upload:' || true)"
          if [ "$(printf '%s\n' "$total_upload_lines" | grep -c . || true)" -ne 1 ]; then
            echo "Expected exactly one Total Upload line from Wrangler."
            exit 1
          fi

          total_upload="$(printf '%s\n' "$total_upload_lines" | sed -E 's/.*(Total Upload:.*)/\1/' | sed -E 's/\x1B\[[0-?]*[ -\/]*[@-~]//g')"
          printf '### Worker bundle size\n\n`%s`\n' "$total_upload" >> "$GITHUB_STEP_SUMMARY"
      - run: npm test
